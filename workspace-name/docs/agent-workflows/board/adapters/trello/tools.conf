# tools.conf: the Trello adapter's tool map.
#
# Plain shell variables, sourced by board.sh. Everything the hooks need to
# recognize a board tool call, read its input, and name the board in a
# message lives here. Another adapter provides the same variables.

# ---------------------------------------------------------------------------
# Product and API
# ---------------------------------------------------------------------------
BOARD_PRODUCT="Trello"
BOARD_API_HOST="api.trello.com"
# Extended regex a Bash command must not match. Keeps card operations on the
# MCP tools, so the gates see them.
BOARD_API_URL_ERE='https?://api\.trello\.com'
# The API host alone, as an extended regex, for rules that match a host
# without a URL scheme.
BOARD_API_HOST_ERE='api\.trello\.com'

# ---------------------------------------------------------------------------
# MCP tools
# ---------------------------------------------------------------------------
BOARD_TOOL_PREFIX="mcp__trello__"
BOARD_TOOL_MOVE="mcp__trello__move_card"
BOARD_TOOL_UPDATE="mcp__trello__update_card_details"
BOARD_TOOL_CREATE="mcp__trello__add_card_to_list"
BOARD_TOOL_COMMENT="mcp__trello__add_comment"
BOARD_TOOL_COMMENT_EDIT="mcp__trello__update_comment"
BOARD_TOOL_COMMENT_DELETE="mcp__trello__delete_comment"
BOARD_TOOL_GET_CARD="mcp__trello__get_card"
BOARD_TOOL_GET_LISTS="mcp__trello__get_lists"
BOARD_TOOL_GET_COLUMN_CARDS="mcp__trello__get_cards_by_list_id"

# Matcher strings for settings.json. Static check S5 verifies them.
BOARD_MATCH_MOVE="mcp__trello__move_card"
BOARD_MATCH_UPDATE="mcp__trello__update_card_details"
BOARD_MATCH_CREATE="mcp__trello__add_card_to_list"
BOARD_MATCH_COMMENT="mcp__trello__add_comment"

# ---------------------------------------------------------------------------
# Tool input and response fields
# ---------------------------------------------------------------------------
BOARD_IN_CARD="cardId"
BOARD_IN_STAGE="listId"
BOARD_IN_BOARD="boardId"
BOARD_IN_DESC="description"
BOARD_IN_NAME="name"
BOARD_IN_LABELS="labels"
BOARD_IN_TEXT="text"
BOARD_IN_COMMENT="commentId"

BOARD_RESPONSE_ID="id"
BOARD_RESPONSE_NUMBER="idShort"
BOARD_RESPONSE_TITLE="name"
BOARD_RESPONSE_BOARD="idBoard"

# ---------------------------------------------------------------------------
# State labels
#
# Trello carries label meaning by color. A state's label is the first label on
# the board with that color. When a hook creates a missing label, it uses the
# name below.
# ---------------------------------------------------------------------------
BOARD_LABEL_COLOR_research_complete="green"
BOARD_LABEL_NAME_research_complete="Research complete"
BOARD_LABEL_COLOR_needs_research="blue"
BOARD_LABEL_NAME_needs_research="Needs research"
BOARD_LABEL_COLOR_qa_fail="red"
BOARD_LABEL_NAME_qa_fail=""
BOARD_LABEL_COLOR_qa_complete="purple"
BOARD_LABEL_NAME_qa_complete="QA complete"
BOARD_LABEL_COLOR_tracking="orange"
BOARD_LABEL_NAME_tracking=""

# ---------------------------------------------------------------------------
# Card ids
# ---------------------------------------------------------------------------
# Extended regex for a card id in a title.
BOARD_CARD_ID_ERE='[a-f0-9]{24}'
