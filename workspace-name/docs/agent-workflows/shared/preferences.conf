# preferences.conf: how the harness behaves, where that is a matter of taste.
#
# Sourced by the shared hooks in this folder. Nothing here changes what the
# gates enforce. These are the settings where reasonable people work
# differently, so the harness asks rather than decides.
#
# Change a value and every role picks it up on its next session. There is
# nothing to restart and nothing to copy between roles.
#
# Shell-sourced. Keep it Bash 3.2 safe: plain assignments, no arrays.

# ---------------------------------------------------------------------------
# HANDOFF_GATE
#
# A handoff is what the next session of a role boots from. Compaction
# summarises session detail away, so the gate exists to get the handoff
# written before that happens.
#
# How much that matters is a working preference, not a rule. Pick one:
#
#   block   Refuse compaction once per session when the handoff is missing or
#           stale, and say what to write. If the session cannot comply, the
#           next attempt goes through anyway, because a gate that traps you
#           has stopped being one. This is the default.
#
#   warn    Never refuse. Tell the agent the handoff is missing or stale and
#           let compaction proceed. Use this if you would rather lose some
#           session detail than be interrupted.
#
#   off     Say nothing, do nothing. Use this if you do not work across
#           sessions, or keep continuity some other way.
#
# An unset or unrecognised value is treated as "block".
# ---------------------------------------------------------------------------
HANDOFF_GATE="block"

# ---------------------------------------------------------------------------
# HANDOFF_FRESHNESS_SECONDS
#
# How old today's handoff may be before it counts as stale. Existence alone
# is not enough: a handoff written at 9am does not describe a 6pm session.
#
# Only consulted when HANDOFF_GATE is "block" or "warn".
# ---------------------------------------------------------------------------
HANDOFF_FRESHNESS_SECONDS=3600

# ---------------------------------------------------------------------------
# BOARD_WATCHER
#
# The column watcher is a doorbell. It polls this role's column every 20
# seconds, read-only, and wakes the agent when a card arrives, so a card
# handed over by another role gets picked up without anyone asking.
#
# It earns its keep when roles run unattended in parallel. It is dead weight
# when you drive one role at a time and can say "check the board" yourself.
# Either way /check-trello reads the column on demand, so nothing is out of
# reach with the watcher off.
#
#   auto    Every role with a column arms its watcher on its first turn.
#           The pipeline runs itself: Research hands a card to Dev, Dev's
#           watcher fires, Dev picks it up. Costs about 3000 characters of
#           session-start context per role, plus one background poll each.
#
#   ask     The role says its watcher is available and waits for you to say
#           yes. Use this if you want the doorbell sometimes, on the sessions
#           where you are going to leave it running.
#
#   off     No watcher, no arm instruction, no polling. Use /check-trello
#           when you want to see the column. This is the default.
#
# The column rule itself is always loaded, whatever this is set to: which
# column belongs to the role, which board, and never to touch another one.
# That is orientation, not a feature.
#
# An unset or unrecognised value is treated as "off".
# ---------------------------------------------------------------------------
BOARD_WATCHER="off"
