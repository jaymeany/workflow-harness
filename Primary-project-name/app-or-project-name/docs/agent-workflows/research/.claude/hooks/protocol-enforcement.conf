# Protocol enforcement config — consumed by gate-card-structure.sh
#
# Source of truth for structural checks derived from the role docs:
#   - Research_Role.md — card-shape rules (Card Description Requirements,
#     Card Sizing, allowed sections, tag format)
#   - Research_Protocol.md   — methodology constraints that surface as
#     structural rules (e.g., what must accompany a "Research Complete" mark)
#
# When either doc changes, update this file and the hook picks it up on next
# invocation. Do NOT inline rules inside the hook script.
#
# Shell-sourced; use bash array syntax.

# ---------------------------------------------------------------------------
# ALLOWED_HEADERS — the canonical section vocabulary for research cards.
#
# NOT ENFORCED: gate-card-structure.sh has no
# allowlist check — it consumes only MAX_FILES and
# REQUIRED_WHEN_RESEARCH_COMPLETE. This list is retained as documentation of
# the canonical vocabulary (and for any future reintroduction of the check);
# the anti-pattern it targeted ("Handoff Notes for Dev", "Implementation
# Order" and other implementation-prescription sections) is covered by
# Research_Protocol.md § Pattern-recognition cues, not by a gate.
# ---------------------------------------------------------------------------
ALLOWED_HEADERS=(
  # --- Canonical research card sections (Research_Role.md) ---
  "Purpose"
  "Scope"
  "Research Complete"
  "Confidence"
  "Dependencies"
  "Services Discovered"
  "Files to Modify"
  "Files to Create"
  "Files to Delete"
  "Required Services"
  "Open Questions"
  "Open Questions (Resolved)"
  "Parent"
  "Children"

  # --- QA-tracking card sections ---
  # Cards QA writes into the Research column when its review of a parent card
  # surfaces a follow-up that needs Research/Dev attention. These cards arrive
  # already substantively complete (file:line citations, acceptance criteria,
  # confidence) but use QA's writing conventions, not Research's. Allowing
  # them keeps QA→Research handoffs frictionless without forcing re-templating.
  "Acceptance"
  "Verified gap"
  "Verified state"
  "Suggested implementation"
  "Documented standard"
  "Expected friction"
  "Notes"
  "Naming convention rename"
  "Origin"
  "Question"
  "Findings"
  "Action"
  "Found by"
  "Surfaced by"
  "Problem"
  "Options for resolution"
  "Out of scope"

  # --- Tolerated header variants (avoid blocking on case/pluralization typos) ---
  "Files to create"
  "File to modify"
)

# ---------------------------------------------------------------------------
# ALLOWED_HEADER_PREFIXES — headers permitted when they begin with one of
# these strings followed by a delimiter (space, "(", or end-of-line).
# Same matching shape used by REQUIRED_WHEN_RESEARCH_COMPLETE.
#
# Used for QA-tracking headers that embed a parent card number or
# qualifier in parentheses (every QA card references a different parent
# number, so exact-match listing isn't practical). Examples:
#   "## Verified gap (from QA review of #33)"     → matches "Verified gap"
#   "## Verified state (from #43 review)"          → matches "Verified state"
#   "## Files to Create (optional, recommended)"  → matches "Files to Create"
#
# Match logic: header == prefix, OR header starts with "${prefix} ",
# OR header starts with "${prefix}(". Anything that puts a non-delimiter
# character after the prefix (e.g., "Verified gaps") is NOT a match.
# ---------------------------------------------------------------------------
ALLOWED_HEADER_PREFIXES=(
  "Verified gap"
  "Verified state"
  "Files to Create"
  "Files to Modify"
  "Files to create"
  "Why"
  "Acceptance"
)
# "Acceptance" prefix lets QA-card variants match: "## Acceptance",
# "## Acceptance Criteria" — both are the same slot semantically.
# "Why" matches QA-card sections like "## Why this is post-MVP debt, not
# a #58/#59 fix" — a descriptive rationale section QA uses to explain why
# a tracking card represents debt rather than a #N fix. Descriptive, not
# prescriptive — fine to allow.

# ---------------------------------------------------------------------------
# MAX_FILES — maximum combined row count across "## Files to Modify" and
# "## Files to Create" tables before a card must be split. Source rule:
# Research_Role.md § Card Sizing (split at >3 files).
#
# A card exceeding the limit is allowed IFF its description references a
# parent card (line matching "Parent: #N") OR lists child cards (line
# matching "Children: #N.1" etc.) — indicating the split structure is already
# in place.
# ---------------------------------------------------------------------------
MAX_FILES=3

# ---------------------------------------------------------------------------
# REQUIRED_WHEN_RESEARCH_COMPLETE — section names that must be present (as
# "## X" headers) whenever a description declares "## Research Complete".
# Enforces the "services documented" + "files identified" + "confidence
# indicator" requirements that together define a research-complete card.
# Source: Research_Role.md § Card Description Requirements +
# § Handoff to Dev, Research_Protocol.md § Confidence
# calibration.
#
# Fires at WRITE time (update_card_details), not at move time. Rationale:
# move_card isn't always Claude's action — the user may move cards via the
# Trello UI directly, in which case a move-time hook never fires. Writing
# "## Research Complete" into a description IS always Claude's action, so
# the gate binds there.
#
# Match uses a "starts-with" rule against the header text so that variants
# like "Services Discovered (with evidence)" still satisfy "Services
# Discovered".
# ---------------------------------------------------------------------------
REQUIRED_WHEN_RESEARCH_COMPLETE=(
  "Services Discovered|Verified gap"
  "Files|Acceptance"
  "Confidence"
)
# Each entry is a "|"-separated list of acceptable header prefixes. The slot
# is satisfied if at least one alternative is present.
#
# Why alternatives: Research and QA both write to the Research column and
# both produce shippable cards, but they use different section names for the
# same substance. Research cards use "Services Discovered" + "Files to
# Modify/Create"; QA-tracking cards use "Verified gap" + "Acceptance". Both
# shapes are equally complete for Dev hand-off; the gate should label both.
#
# - "Services Discovered|Verified gap" — substance evidence (what exists,
#   what's missing, with file:line citations)
# - "Files|Acceptance" — actionable surface (Research lists files; QA lists
#   acceptance criteria for the change)
# - "Confidence" — same in both
#
# "Files" is a prefix that accepts "## Files to Modify", "## Files to Create",
# or "## Files". "Acceptance" is a prefix that accepts "## Acceptance" or
# "## Acceptance Criteria".

# ---------------------------------------------------------------------------
# board_tag <boardId> — prints the worktree tag for that board, or empty if the
# board is unmapped. The trailing tag on a card title must reflect the board the
# card ACTUALLY lives on (reality), so the tag is derived per-card rather than
# hardcoded. An unmapped board prints empty and the hook then skips the tag
# check (it never imposes an invented tag where the real mapping is unknown).
#
# This is a SINGLE-board project (see the walk-up project CLAUDE.md § Trello), so
# there is exactly one mapping today. The per-board shape is kept anyway: a
# second board would be a one-line addition rather than a rewrite.
#
# ⚠ AN UNMAPPED BOARD SILENTLY DISABLES THE TITLE GATE. board_tag prints empty,
# gate-card-title.sh then skips the check rather than inventing a tag, and no
# card title is ever validated. If the board id changes, change it HERE too.
#
# ⚠ Implemented as a case/function, NOT a `declare -A` associative array: these
# hooks run under macOS /bin/bash **3.2**, which has no associative arrays. A
# `declare -A` here fails to source ("value too great for base") and silently
# breaks EVERY hook that sources this conf — gate-card-title, gate-card-structure,
# and lib.sh → gate-research-complete (the green-label advance). Keep it 3.2-safe.
#
# Card title format: "#<idShort> <title> <24-char Trello id>", with an optional
# trailing <tag>.
#
# Consumed by gate-card-title.sh.
# ---------------------------------------------------------------------------
board_tag() {
  # The project board (single board): BOARD_ID from the board layer's
  # board.conf, set during setup.
  if [[ -n "${BOARD_ID:-}" && "$1" == "$BOARD_ID" ]]; then
    printf 'dev'
  else
    printf ''
  fi
}
