<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="A closed loop with four stations on it, marked research, design, dev and QA, and a chevron on each straight run showing the work travelling clockwise. A single small square on the loop is the card, the unit of work, and it is the only thing drawn as moving. Four dashed lines cross the interior, a separate channel the roles use to talk to each other." style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><g stroke="#e6edf3" stroke-width="1.25" fill="none" opacity="0.35" stroke-dasharray="5 5"><line x1="300" y1="80" x2="700" y2="360"></line><line x1="700" y1="80" x2="300" y2="360"></line><line x1="300" y1="80" x2="300" y2="360"></line><line x1="700" y1="80" x2="700" y2="360"></line></g><g stroke="#e6edf3" stroke-width="1.5" fill="none"><path d="M200 80 H800 A140 140 0 0 1 800 360 H200 A140 140 0 0 1 200 80"></path><path d="M240 70 L250 80 L240 90"></path><path d="M700 350 L690 360 L700 370"></path><line x1="300" y1="71" x2="300" y2="89"></line><line x1="700" y1="71" x2="700" y2="89"></line><line x1="700" y1="351" x2="700" y2="369"></line><line x1="300" y1="351" x2="300" y2="369"></line><rect x="493" y="73" width="14" height="14"></rect></g><g fill="#e6edf3" letter-spacing="0.08em" style="text-transform:uppercase"><text x="300" y="56" font-size="16" text-anchor="middle">Research</text><text x="700" y="56" font-size="16" text-anchor="middle">Design</text><text x="700" y="396" font-size="16" text-anchor="middle">Dev</text><text x="300" y="396" font-size="16" text-anchor="middle">QA</text><text x="500" y="110" font-size="15" text-anchor="middle">Card</text><text x="288" y="225" font-size="15" text-anchor="end">Messages</text></g></svg>